<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="card">
    <h1>Você está logado</h1>
    <p>Conectado como <strong id="user-email"></strong></p>
    <button id="logout-btn">Sair</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script>
    // Protege a página: sem sessão, volta para o login
    db.auth.getSession().then(({ data }) => {
      if (!data.session) return (window.location.href = "index.html");
      document.getElementById("user-email").textContent = data.session.user.email;
    });
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await db.auth.signOut();
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
